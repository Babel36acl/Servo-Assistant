[package]
name = "servo-assistant"
version = "0.4.0"
description = "Device-neutral servo parameter commissioning assistant"
authors = ["Servo Assistant contributors"]
license = "GPL-3.0-only"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "servo_assistant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4.10"
thiserror = "2"
rusqlite = { version = "0.37", features = ["bundled"] }

[patch.crates-io]
# GTK3 requires 0.18; backport upstream PR #1343 until a compatible fix is published.
glib = { path = "vendor/glib" }

[target.'cfg(target_os = "linux")'.dev-dependencies]
glib = "0.18.5"
