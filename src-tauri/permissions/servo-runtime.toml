  "start_recording",
  "stop_recording",
  "recording_status",
  "recording_sessions",
  "recording_page",
  "recording_modbus_transaction",
  "recording_overview",
  "recording_context",
  "recording_history",
  "recording_info",
  "recording_annotate",
  "recording_mapping",
  "recording_browse",
  "capture_file_page",
  "export_recording_pcap",
  "decode_ethercat",
