  "ethercat_connect",
  "ethercat_disconnect",
  "ethercat_status",
  "ethercat_profile",
  "ethercat_read",
  "ethercat_write",
  "start_network_capture",
  "stop_network_capture",
  "network_capture_status",

  "discover_device",
  "cancel_discovery",
  "get_discovery_status",
  "configure_communication",
  "get_communication_stats",
  "probe_read",
  "import_profile",
  "get_active_profile",
