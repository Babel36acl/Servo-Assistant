name: Release

# 只在推送版本标签时构建并发布；main 分支不自动构建。
# 用法：git tag v0.5.0 && git push origin v0.5.0
#
# workflow_dispatch 是维护者的预演入口：用输入的版本号跑完整构建，
# 产出与正式发版一致的 artifact，但 publish 只在标签推送时执行（预演不发布）。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: 预演版本号（x.y.z），仅构建 artifact，不会创建 Release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Validate release tag
        id: meta
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="v${INPUT_VERSION}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::发布标签必须为 v<主>.<次>.<修订>，当前为 $tag"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            bundles: msi,nsis
          - platform: linux
            os: ubuntu-22.04
            bundles: deb,rpm,appimage
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libudev-dev patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Apply release version
        run: ./scripts/release-version.ps1 -Apply -Version $env:RELEASE_VERSION

      - name: Verify release version
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(?<version>[0-9]+\.[0-9]+\.[0-9]+)$') {
            throw "标签必须使用 v<主>.<次>.<修订> 格式，当前为 $env:RELEASE_TAG"
          }

          $tagVersion = $Matches['version']
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargoMetadata = cargo metadata --manifest-path src-tauri/Cargo.toml --no-deps --format-version 1 | ConvertFrom-Json
          $cargoVersion = ($cargoMetadata.packages | Where-Object name -eq 'servo-assistant').version

          $versions = @($packageVersion, $tauriVersion, $cargoVersion)
          if ($versions | Where-Object { $_ -ne $tagVersion }) {
            throw "版本不一致：tag=$tagVersion package=$packageVersion tauri=$tauriVersion cargo=$cargoVersion"
          }

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Test before release
        run: |
          pnpm build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path src-tauri/Cargo.toml --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --manifest-path src-tauri/Cargo.toml --locked -- -D warnings

      - name: Build packages
        uses: tauri-apps/tauri-action@1ddc7b49b13c3038297360482fcb3e058764d7c9 # v0.6.2
        with:
          tauriScript: pnpm tauri
          args: --bundles ${{ matrix.bundles }} --verbose

      - name: Test glib security backport with optimizations
        if: runner.os == 'Linux'
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --release --test glib_security

      - name: Package Windows portable
        if: runner.os == 'Windows'
        run: ./scripts/package-portable.ps1

      - name: Stage packages
        env:
          PACKAGE_PLATFORM: ${{ matrix.platform }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Path release-files -Force | Out-Null
          $patterns = if ($env:PACKAGE_PLATFORM -eq 'windows') { @('msi/*.msi','nsis/*-setup.exe','portable/*.zip') } else { @('deb/*.deb','rpm/*.rpm','appimage/*.AppImage') }
          foreach ($pattern in $patterns) {
            $files = @(Get-ChildItem "src-tauri/target/release/bundle/$pattern")
            if ($files.Count -ne 1) { throw "预期一个产物：$pattern，实际 $($files.Count)" }
            $suffix = switch ($files[0].Extension) { '.msi' { 'setup.msi' } '.exe' { 'setup.exe' } '.zip' { 'portable.zip' } '.deb' { 'package.deb' } '.rpm' { 'package.rpm' } '.AppImage' { 'portable.AppImage' } }
            Copy-Item -LiteralPath $files[0].FullName -Destination "release-files/Servo-Assistant_${version}_$($env:PACKAGE_PLATFORM)_x64_$suffix"
          }

      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.platform }}
          path: release-files/*
          if-no-files-found: error

  android:
    name: Build android
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17

      # runner 镜像自带 Android SDK/NDK（ANDROID_HOME / ANDROID_NDK_HOME 已设好）；
      # setup-android、setup-ndk 动作已下架或损坏，不要再加回来。
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Apply release version
        shell: pwsh
        run: ./scripts/release-version.ps1 -Apply -Version $env:RELEASE_VERSION

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Decode Android keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_KEYSTORE_BASE64:-}" ]]; then
            echo "::error::缺少 ANDROID_KEYSTORE_BASE64 secret，无法签名安卓安装包"
            exit 1
          fi
          keystore="$RUNNER_TEMP/release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          echo "ANDROID_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      # 版本号来源：Tauri 每次安卓构建都会按 tauri.conf.json 的 version 重写
      # gen/android/app/tauri.properties —— versionName = 该版本号，
      # versionCode = 主*1000000 + 次*1000 + 修订（未配置 bundle.android.versionCode
      # 时的默认推导）。所以上面先 Apply release version，安卓版本号自动跟随。
      # 三个 ABI 不打 --split-per-abi，产出单个 universal APK，安装最省事。
      - name: Build signed universal APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: pnpm tauri android build --apk --target aarch64 armv7 x86_64

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find src-tauri/gen/android/app/build/outputs/apk -path '*/release/*.apk')
          if [[ ${#apks[@]} -ne 1 ]]; then
            echo "::error::预期一个 universal release APK，实际 ${#apks[@]} 个"
            find src-tauri/gen/android/app/build/outputs/apk -name '*.apk'
            exit 1
          fi
          apk="${apks[0]}"
          case "$apk" in
            *unsigned*) echo "::error::APK 未签名：$apk"; exit 1 ;;
          esac
          build_tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$build_tools/apksigner" verify --print-certs "$apk"
          mkdir -p release-files
          cp "$apk" "release-files/Servo-Assistant_${RELEASE_VERSION}_android_universal.apk"
          ls -l release-files

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-android
          path: release-files/*.apk
          if-no-files-found: error

  verify-linux:
    name: Verify ${{ matrix.distro }} package
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro: [debian, fedora, arch]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download Linux packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-linux
          path: release-files
      - name: Check installation and linked libraries
        env:
          DISTRO: ${{ matrix.distro }}
        run: bash scripts/verify-linux-package.sh "$DISTRO"

  publish:
    name: Publish Release
    needs: [prepare, build, verify-linux, android]
    # 预演（workflow_dispatch）只构建 artifact，不创建 GitHub Release。
    if: github.event_name == 'push'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release-files
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; preserving published assets."
            exit 0
          fi
          gh release create "$RELEASE_TAG" release-files/* --verify-tag --title "Servo Assistant $RELEASE_TAG" --notes-file docs/release-notes.md
