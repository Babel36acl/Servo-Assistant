name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Select next release version
        id: version
        shell: pwsh
        run: ./scripts/release-version.ps1

  build:
    needs: prepare
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            bundles: msi,nsis
          - platform: linux
            os: ubuntu-22.04
            bundles: deb,rpm,appimage
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libudev-dev patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Apply release version
        run: ./scripts/release-version.ps1 -Apply -Version $env:RELEASE_VERSION

      - name: Verify release version
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(?<version>[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?)$') {
            throw "标签必须使用 v<SemVer> 格式，当前为 $env:RELEASE_TAG"
          }

          $tagVersion = $Matches['version']
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargoMetadata = cargo metadata --manifest-path src-tauri/Cargo.toml --no-deps --format-version 1 | ConvertFrom-Json
          $cargoVersion = ($cargoMetadata.packages | Where-Object name -eq 'servo-assistant').version

          $versions = @($packageVersion, $tauriVersion, $cargoVersion)
          if ($versions | Where-Object { $_ -ne $tagVersion }) {
            throw "版本不一致：tag=$tagVersion package=$packageVersion tauri=$tauriVersion cargo=$cargoVersion"
          }

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Test before release
        run: |
          pnpm build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path src-tauri/Cargo.toml --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --manifest-path src-tauri/Cargo.toml --locked -- -D warnings

      - name: Build packages
        uses: tauri-apps/tauri-action@1ddc7b49b13c3038297360482fcb3e058764d7c9 # v0.6.2
        with:
          tauriScript: pnpm tauri
          args: --bundles ${{ matrix.bundles }} --verbose

      - name: Test glib security backport with optimizations
        if: runner.os == 'Linux'
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --release --test glib_security

      - name: Package Windows portable
        if: runner.os == 'Windows'
        run: ./scripts/package-portable.ps1

      - name: Stage packages
        env:
          PACKAGE_PLATFORM: ${{ matrix.platform }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Path release-files -Force | Out-Null
          $patterns = if ($env:PACKAGE_PLATFORM -eq 'windows') { @('msi/*.msi','nsis/*-setup.exe','portable/*.zip') } else { @('deb/*.deb','rpm/*.rpm','appimage/*.AppImage') }
          foreach ($pattern in $patterns) {
            $files = @(Get-ChildItem "src-tauri/target/release/bundle/$pattern")
            if ($files.Count -ne 1) { throw "预期一个产物：$pattern，实际 $($files.Count)" }
            $suffix = switch ($files[0].Extension) { '.msi' { 'setup.msi' } '.exe' { 'setup.exe' } '.zip' { 'portable.zip' } '.deb' { 'package.deb' } '.rpm' { 'package.rpm' } '.AppImage' { 'portable.AppImage' } }
            Copy-Item -LiteralPath $files[0].FullName -Destination "release-files/Servo-Assistant_${version}_$($env:PACKAGE_PLATFORM)_x64_$suffix"
          }

      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.platform }}
          path: release-files/*
          if-no-files-found: error

  verify-linux:
    name: Verify ${{ matrix.distro }} package
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro: [debian, fedora, arch]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download Linux packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-linux
          path: release-files
      - name: Check installation and linked libraries
        env:
          DISTRO: ${{ matrix.distro }}
        run: bash scripts/verify-linux-package.sh "$DISTRO"

  publish:
    name: Publish Release
    needs: [prepare, build, verify-linux]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release-files
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; preserving published assets."
            exit 0
          fi
          gh release create "$RELEASE_TAG" release-files/* --target "$GITHUB_SHA" --title "Servo Assistant $RELEASE_TAG" --notes-file docs/release-notes.md
