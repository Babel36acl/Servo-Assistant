name: 安卓构建
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "src-tauri/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17

      # 官方 runner 镜像自带完整 Android SDK：platform android-37.x、
      # build-tools 37.0.0、NDK 27.3（ANDROID_HOME/ANDROID_NDK_HOME 已设好），
      # 不需要任何 setup-android/ndk 动作或 sdkmanager 安装步骤

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: aarch64-linux-android

      - run: pnpm install --frozen-lockfile

      - name: 前端测试与构建
        run: pnpm test

      - name: 编译安卓 debug APK（arm64）
        run: pnpm tauri android build --debug --target aarch64

      - name: 上传 APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: servo-assistant-debug-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/debug/*.apk
          if-no-files-found: error
