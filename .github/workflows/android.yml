name: 安卓构建
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "src-tauri/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 官方 runner 自带 Android SDK；android-actions/setup-android@v3 已坏
      # （sdkmanager 找不到 'tools' 包），直接用镜像里的 sdkmanager 装平台与 NDK
      - name: 安装平台与 NDK r27c
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKM="$(command -v sdkmanager || ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)"
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platforms;android-37" "ndk;27.2.12479018" > /dev/null
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - run: pnpm install --frozen-lockfile

      - name: 前端测试与构建
        run: pnpm test

      - name: 编译安卓 debug APK（arm64）
        run: pnpm tauri android build --debug --target aarch64

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: servo-assistant-debug-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/debug/*.apk
          if-no-files-found: error
