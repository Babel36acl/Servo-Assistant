name: CI

# 只做检查，不打包、不发布；发布由推送 vX.Y.Z 标签触发 release.yml。
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (Windows)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint design tokens
        run: pnpm lint:tokens

      - name: Check frontend
        run: pnpm build

      - name: Test frontend state
        run: pnpm test

      - name: Test Rust core
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Lint Rust core
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked -- -D warnings
